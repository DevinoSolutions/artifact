name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Without this, every push to every branch started a full run that nothing
# superseded: this workflow uploads and downloads a 130 MiB fixture per Linux
# job, so redundant runs are not free even on hosted runners. Group name
# matches the org's prevailing ci.yml style; main is exempt from cancellation
# so a push there always finishes validating.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  roundtrip:
    name: roundtrip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # GitHub-hosted only. This repository is public, and the org's only
      # self-hosted runner group (Default) sets allows_public_repositories:
      # false, so a job asking for `ubuntu-devino` here can never be assigned
      # and queues forever. That restriction is deliberate and should stay:
      # letting a public repo onto self-hosted runners exposes them to fork
      # pull requests. The Linux pool path is exercised continuously anyway by
      # the 51 consumer upload steps that run this action on `ubuntu-devino`.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Generate fixture data
        shell: bash
        run: python3 tests/fixtures.py data "${{ matrix.os }}" || python tests/fixtures.py data "${{ matrix.os }}"

      # 1. single directory: root must be the directory itself, hidden files excluded
      - name: Upload single directory
        id: up1
        uses: ./upload
        with:
          name: single-${{ matrix.os }}
          path: data
          retention-days: 1

      - name: Download by name
        uses: ./download
        with:
          name: single-${{ matrix.os }}
          path: out1

      - name: Verify single
        shell: bash
        run: python3 tests/verify.py single data out1 || python tests/verify.py single data out1

      # 2. multiple explicit files -> LCA root; include hidden
      - name: Upload multiple paths
        uses: ./upload
        with:
          name: multi-a-${{ matrix.os }}
          path: |
            data/a.txt
            data/sub/b.bin
            data/.hidden.txt
          include-hidden-files: true
          retention-days: 1

      # 3. glob pattern with exclusion
      - name: Upload glob
        uses: ./upload
        with:
          name: multi-b-${{ matrix.os }}
          path: |
            data/**/*.txt
            !data/sub/skip.txt
          retention-days: 1

      - name: Download pattern (merged)
        uses: ./download
        with:
          pattern: multi-*-${{ matrix.os }}
          merge-multiple: true
          path: out2

      - name: Download pattern (per-artifact dirs)
        uses: ./download
        with:
          pattern: multi-*-${{ matrix.os }}
          path: out3

      - name: Verify multi
        shell: bash
        run: python3 tests/verify.py multi data out2 out3 "${{ matrix.os }}" || python tests/verify.py multi data out2 out3 "${{ matrix.os }}"

      # 4. if-no-files-found semantics
      - name: No files (warn)
        uses: ./upload
        with:
          name: none-${{ matrix.os }}
          path: does-not-exist/**

      - name: No files (error)
        id: noerr
        continue-on-error: true
        uses: ./upload
        with:
          name: none-${{ matrix.os }}
          path: does-not-exist/**
          if-no-files-found: error

      - name: Assert error outcome
        shell: bash
        run: test "${{ steps.noerr.outcome }}" = "failure"

      - name: Download missing artifact fails
        id: nodl
        continue-on-error: true
        uses: ./download
        with:
          name: none-${{ matrix.os }}

      - name: Assert download failure
        shell: bash
        run: test "${{ steps.nodl.outcome }}" = "failure"

      - name: Outputs are set
        shell: bash
        run: |
          test -n "${{ steps.up1.outputs.artifact-id }}"
          test -n "${{ steps.up1.outputs.artifact-digest }}"

  cross-job:
    name: cross-job download
    needs: roundtrip
    # Was `ubuntu-devino`; moved to a hosted runner for the reason given on the
    # roundtrip matrix above. What this job actually tests is that one job can
    # fetch artifacts uploaded by *other* jobs on *other* operating systems,
    # which does not depend on where this job itself runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download every single-* artifact from all OSes
        uses: ./download
        with:
          pattern: single-*
          path: all
      - name: Verify all three
        shell: bash
        run: |
          ls -la all
          for os in ubuntu-latest windows-latest macos-latest; do
            test -f "all/single-$os/a.txt" || { echo "missing $os"; exit 1; }
          done

  unit:
    # Pure-python, mocks subprocess: no network, no mc, no OIDC, no runner pool.
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" -m unittest discover -s tests -p "test_*.py" -v
