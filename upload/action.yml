name: "Devino artifact upload"
description: "Drop-in replacement for actions/upload-artifact that stores artifacts on Devino's self-hosted MinIO (storage.devino.ca) using the job's GitHub OIDC token."
author: DevinoSolutions
branding:
  icon: upload-cloud
  color: blue

inputs:
  name:
    description: "Artifact name"
    default: artifact
  path:
    description: "A file, directory or wildcard pattern that describes what to upload (one per line, '!' to exclude)"
    required: true
  if-no-files-found:
    description: "warn | error | ignore"
    default: warn
  retention-days:
    description: "Days to keep the artifact. Rounded up to 1/3/5/7/14/30/90 (capped at 90); unset means 14 days."
    default: ""
  compression-level:
    description: "gzip level 0-9"
    default: "6"
  overwrite:
    description: "Accepted for compatibility; uploads always overwrite an artifact with the same name in the same run."
    default: "false"
  include-hidden-files:
    description: "Include files and directories whose name starts with '.'"
    default: "false"
  endpoint:
    description: "S3 endpoint (defaults to https://storage.devino.ca)"
    default: ""
  bucket:
    description: "Bucket name (defaults to gh-artifacts)"
    default: ""
  access-key:
    description: "Static access key (optional; OIDC is used when omitted)"
    default: ""
  secret-key:
    description: "Static secret key (optional; OIDC is used when omitted)"
    default: ""

outputs:
  artifact-id:
    description: "Object key of the uploaded archive"
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: "s3:// URI of the uploaded archive"
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact-digest:
    description: "sha256 of the uploaded archive"
    value: ${{ steps.upload.outputs.artifact-digest }}

runs:
  using: composite
  steps:
    - id: upload
      shell: bash
      env:
        INPUT_NAME: ${{ inputs.name }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_IF_NO_FILES_FOUND: ${{ inputs.if-no-files-found }}
        INPUT_RETENTION_DAYS: ${{ inputs.retention-days }}
        INPUT_COMPRESSION_LEVEL: ${{ inputs.compression-level }}
        INPUT_OVERWRITE: ${{ inputs.overwrite }}
        INPUT_INCLUDE_HIDDEN_FILES: ${{ inputs.include-hidden-files }}
        INPUT_ENDPOINT: ${{ inputs.endpoint }}
        INPUT_BUCKET: ${{ inputs.bucket }}
        INPUT_ACCESS_KEY: ${{ inputs.access-key }}
        INPUT_SECRET_KEY: ${{ inputs.secret-key }}
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY="$(command -v python3 || command -v python)"; fi
        exec "$PY" "$GITHUB_ACTION_PATH/../lib/main.py" upload
